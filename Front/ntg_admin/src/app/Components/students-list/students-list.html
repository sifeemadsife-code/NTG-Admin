<div class="dashbored">
  <div class="sidebar">
    <div class="logo">
      <div class="header-white">
        <img src="/images/logo.png" alt="NTG">
      </div>
    </div>
    <nav class="menu">
      <a *ngFor="let item of menuItems" [routerLink]="item.route" [class.active]="item.active" class="menu-item">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
      <a class="menu-item logout" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span>Log Out</span>
      </a>
    </nav>
  </div>

  <div class="engineers-page">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1>Students</h1>
        <p>Dashboard > Students</p>
      </div>
    </div>

    <!-- Top Controls -->
    <div class="toolbar">
      <div class="search-box">
        <input type="text" placeholder="Search by name,ID,subject..." />
      </div>

      <div class="filters">
        <select title="DDD">
          <option>Status</option>
          <option>Active</option>
          <option>Leave</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Grade</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          @for (student of students(); track student.id) {
            <tr>
              <td class="Student-info">
                <span>{{ student.id }}</span>
              </td>

              <td>{{ student.first_name }} {{ student.last_name }}</td>

              <td>{{ student.grade }}</td>

              <td>
                <span [class.active]="!student.status" [class.inactive]="student.status">
                  {{ student.status ? 'Inactive' : 'Active' }}
                </span>
              </td>
              <td class="actions">
                <button><img src="/images/view_icon.png" alt="" /></button>
              </td>
            </tr>
          } @empty {
            <h1>No Students</h1>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
