<div class="dashbored">
    <app-sidebar></app-sidebar>

    <div class="page">
        <div class="page-header">
            <div>
                <h1>Send Notification</h1>
                <p>Notification > Send Notification</p>
            </div>
            <a class="back-btn" routerLink="/notifications">Back</a>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">
            @if (error()) {
            <p class="error-text">{{ error() }}</p>
            }

            <label>Send To</label>
            <select formControlName="sentToId">
                <option value="">Select Recipient</option>
                @for (recipient of recipients(); track recipient.id) {
            <option [value]="recipient.id">
                {{ recipient.firstName }} {{ recipient.lastName }} ({{ recipient.roleName }})
            </option>
            }
            </select>

            <label>Title</label>
            <input type="text" formControlName="title" placeholder="Notification title" />

            <label>Priority</label>
            <select formControlName="priority">
                <option value="LOW">Low</option>
                <option value="NORMAL">Normal</option>
                <option value="HIGH">High</option>
            </select>

            <label>Body</label>
            <textarea rows="6" formControlName="body" placeholder="Write your notification body..."></textarea>

            <button type="submit" [disabled]="saving()">
                {{ saving() ? 'Sending...' : 'Send Notification' }}
            </button>
        </form>
    </div>
</div>
