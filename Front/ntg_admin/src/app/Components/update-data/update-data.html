<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo-box">
      <img src="assets/images/logo.png" class="logo" alt="NTG Logo">
    </div>

    <div class="profile-section">

      <h2>Profile Photo</h2>

      <div class="avatar-box">
        <img
          [src]="imageSrc"
          class="avatar"
          alt="Avatar"
        >
      </div>

      <input
        type="file"
        hidden
        #fileInput
        (change)="onImageSelected($event)"
      >

      <button class="change-btn" (click)="fileInput.click()">
        <i class="fa fa-camera"></i>
        Change Photo
      </button>

    </div>

  </aside>

  <!-- CONTENT -->
  <main class="content">

    <div class="header">

      <div>
        <h1>Engineers</h1>

        <p class="breadcrumb">
          Dashboard > Engineers > Edit Engineer
        </p>
      </div>

      <button class="back-btn">
        <i class="fa fa-chevron-left"></i>
        Back
      </button>

    </div>

    <div class="edit-card">

      <!-- LEFT -->

      <div class="form-section">

        <h3>Personal Information</h3>

        <div class="form-group">
          <label>Full Name*</label>

          <input
            type="text"
            [(ngModel)]="engineer.fullName">
        </div>

        <div class="form-group">
          <label>Email*</label>

          <input
            type="email"
            [(ngModel)]="engineer.email">
        </div>

        <div class="form-group">
          <label>Phone*</label>

          <input
            type="text"
            [(ngModel)]="engineer.phone">
        </div>

      </div>

      <!-- RIGHT -->

      <div class="form-section">

        <h3>Professional Information</h3>

        <div class="form-group">
          <label>Subject*</label>

          <input
            type="text"
            [(ngModel)]="engineer.subject">
        </div>

        <div class="row">

          <div class="small-group">
            <label>Experience*</label>

            <input
              type="text"
              [(ngModel)]="engineer.experience">
          </div>

          <div class="small-group">
            <label>Join Date*</label>

            <input
              type="date"
              [(ngModel)]="engineer.joinDate">
          </div>

        </div>

        <div class="form-group">
          <label>Password*</label>

          <input
            type="password"
            [(ngModel)]="engineer.password">
        </div>

        <button class="save-btn">
          Save Change
        </button>

      </div>

    </div>

  </main>

</div>
