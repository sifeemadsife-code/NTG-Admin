<div class="dashbored">
    <app-sidebar></app-sidebar>
    <div class="page">
        <div class="page-header">
            <div>
                <h1>Edit Training Program</h1>
                <p>Dashboard &gt; Training Programs &gt; Edit Program</p>
            </div>

            <a class="back-btn" routerLink="/programsList">Back</a>
        </div>

        @if (loading()) {
        <p class="status-text">Loading training program...</p>
        } @else {

        <div class="form-card">

            @if (error()) {
            <p class="error-text">{{ error() }}</p>
            }

            <form [formGroup]="editForm" (ngSubmit)="saveProgram()">

                <div class="form-group">
                    <div>
                        <label>Program Name</label>
                        <input type="text" formControlName="programName" placeholder="Enter program name" />
                    </div>

                    <div>
                        <label>Location</label>
                        <input type="text" formControlName="location" placeholder="Enter program location" />
                    </div>
                </div>

                <div class="form-group">
                    <div class="full">
                        <label>Description</label>
                        <textarea rows="4" formControlName="description"
                            placeholder="Enter program description"></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <div>
                        <label>Start Date</label>
                        <input type="date" formControlName="startDate" />
                    </div>

                    <div>
                        <label>End Date</label>
                        <input type="date" formControlName="endDate" />
                    </div>
                </div>

                <button type="submit" [disabled]="saving()">
                    {{ saving() ? 'Saving...' : 'Save Changes' }}
                </button>
            </form>
        </div>
        }
    </div>
</div>
