<div class="dashbored">
<aside class="sidebar">
  <div class="logo-section">
    <img alt="NTG Logo" src="/images/logo.png" class="logo" />
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/dashboard.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Dashboard</a></span>
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/adminstrator.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Engineers</a></span>
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/reading.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Students</a></span>
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/reports.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Reports</a></span>
  </div>
  <div class="logo-engineer">
    <img alt="icon" src="/images/code.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Training Programs</a></span>
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/books.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Subjects</a></span>
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/Setting.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Settings</a></span>
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/user.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Profile</a></span>
  </div>
  <div class="logo-text">
    <img alt="icon" src="/images/logout.png" width="25" height="25" />
    <span class="sidebar-text"><a href="">Logout</a></span>
  </div>
</aside>
<div class="page">
  <div class="page-header">
    <div>
      <h1>Create Program</h1>
      <p>Dashboard > Training Programs > Create Program</p>
    </div>
  </div>
  <div class="form-card">


    <form [formGroup]="trainingForm" (ngSubmit)="createProgram()">
      <div class="form-group">
        <div>
          <label>Program Name</label>
        <input type="text" formControlName="title" placeholder="Enter program title" />
        </div>
        <div>
            <label>Engineer</label>

          <select formControlName="engineerId">
            <option value="">Select Engineer</option>
            @for (engineer of engineers(); track engineer.id) {
              <option [value]="engineer.id">
                {{ engineer.firstName }} {{ engineer.lastName }}
              </option>
            }
          </select>
        </div>

      </div>

      <div class="form-group">


        <div>
          <label>Location</label>
        <input type="text" formControlName="location" placeholder="Enter program location" />

        </div>
        <div>
        <label>Description</label>
        <textarea formControlName="description" placeholder="Enter program description"></textarea>
       </div>

      </div>

      <div class="form-group">
        <div>
          <label>Start Date</label>
          <input type="date" formControlName="startDate" />
        </div>
        <div>
          <label>End Date</label>
          <input type="date" formControlName="endDate" />
        </div>
      </div>


      <button type="submit">Create Program</button>
    </form>
  </div>
</div>

</div>
