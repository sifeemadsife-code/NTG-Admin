<!-- confirm-dialog-component.html -->
@if (confirmDialog().show && confirmDialog().options) {
  <div class="confirm-overlay" (click)="onOverlayClick($event)">
    <div class="confirm-dialog">
      <div class="confirm-header" [class.danger]="confirmDialog().options?.type === 'danger'">
        <div class="confirm-icon">
          @if (confirmDialog().options?.type === 'danger') {
            <i class="fa-solid fa-trash-can"></i>
          } @else if (confirmDialog().options?.type === 'warning') {
            <i class="fa-solid fa-triangle-exclamation"></i>
          } @else {
            <i class="fa-solid fa-circle-question"></i>
          }
        </div>
        <h3>{{ confirmDialog().options?.title }}</h3>
      </div>
      <div class="confirm-body">
        <p>{{ confirmDialog().options?.message }}</p>
      </div>
      <div class="confirm-footer">
        <button class="btn-cancel" (click)="onCancel()">
          {{ confirmDialog().options?.cancelText || 'No' }}
        </button>
        <button class="btn-confirm" [class.danger]="confirmDialog().options?.type === 'danger'" (click)="onConfirm()">
          {{ confirmDialog().options?.confirmText || 'Yes' }}
        </button>
      </div>
    </div>
  </div>
}
