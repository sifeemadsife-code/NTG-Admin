    <div class="logo-text1">
      <img alt="icon" src="/images/reading.png" width="25" height="25" />

    <div class="logo-text">

    <div class="logo-text">

    <div class="logo-text">

  <div class="engineers-page">

    <div class="page-header">
      <div>
        <h1>Engineers</h1>
        <p>Dashboard > Engineers > Add Engineer</p>
      </div>
    </div>

    <form class="page" (ngSubmit)="addEngineer()" #engineerForm="ngForm">
      <div class="logo-page">
        <img class="image-logo" src="/images/reading.png" alt="image for engineer">
      </div>
      <div class="form">
        <h1>Personal Information</h1>

        @if (errorMessage()) {
          <p class="error-text">{{ errorMessage() }}</p>
        }

        <div class="name">
          <p class="name-l">First Name</p>
          <input
            class="input-form"
            type="text"
            name="firstName"
            placeholder="Enter First Name"
            [(ngModel)]="newEngineer().firstName"
            required>
          <p class="name-l">last Name</p>
          <input
            class="input-form"
            type="text"
            name="lastName"
            placeholder="Enter Last Name"
            [(ngModel)]="newEngineer().lastName"
            required>
        </div>
        <p>Email</p>
        <input
          class="input-form"
          type="email"
          name="email"
          placeholder="Enter Email"
          [(ngModel)]="newEngineer().email"
          required>
        <p>Password</p>
        <input
          class="input-form"
          type="password"
          name="password"
          placeholder="Enter Password"
          [(ngModel)]="newEngineer().password"
          required>
        <h1>Professional Information</h1>
        <input
          class="input-form1"
          type="text"
          name="education"
          placeholder="Enter Education"
          [(ngModel)]="newEngineer().education">
        <input
          class="input-form1"
          type="number"
          name="numberOfYearsOfExperience"
          placeholder="Experience(years)"
          [(ngModel)]="newEngineer().numberOfYearsOfExperience">
        <input
          class="input-form2"
          type="text"
          name="employmentHistory"
          placeholder="Employment History"
          [(ngModel)]="newEngineer().employmentHistory">
        <button type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Adding...' : 'Add Engineer' }}
        </button>
      </div>
    </form>
</div>
