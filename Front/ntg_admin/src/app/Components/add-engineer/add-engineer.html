
<div class="dashbored">
<app-sidebar></app-sidebar>
  <div class="engineers-page">
    <div class="page-header">
      <div>
        <h2>Engineers</h2>
        <p>Engineers > Add Engineer</p>
      </div>
    </div>
<form class="page" (ngSubmit)="addEngineer()" #engineerForm="ngForm">
  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }

  <div class="form-container">
    <div class="section">
      <h2>Personal Information</h2>
      <div class="name">
        <div class="name-group">
          <label>First Name</label>
          <input class="input-form" type="text"
          name="firstName"
          [(ngModel)]="newEngineer().firstName"
          placeholder="Enter First Name"
          required>
        </div>

        <div class="name-group">
          <label>Last Name</label>
          <input class="input-form"
          type="text"
          name="lastName"
          [(ngModel)]="newEngineer().lastName"
          placeholder="Enter Last Name"
          required>
        </div>
      </div>

      <div class="name">
        <div class="name-group">
          <label>First Name Arabic</label>
          <input class="input-form"
          type="text"
          name="firstNameInArabic"
          [(ngModel)]="newEngineer().firstNameInArabic"
          placeholder="Enter First Name Arabic"
          required>
        </div>

        <div class="name-group">
          <label>Last Name Arabic</label>
          <input class="input-form"
          type="text"
          name="lastNameInArabic"
          [(ngModel)]="newEngineer().lastNameInArabic"
          placeholder="Enter Last Name Arabic"
          required>
        </div>
      </div>

      <label>Email</label>
      <input class="input-form"
      type="email"
      name="email"
      [(ngModel)]="newEngineer().email"
      placeholder="Enter Email"
      required>

      <label>Password</label>
      <input class="input-form"
      type="password"
      minlength="6"
      maxlength="12"
      name="password"
      [(ngModel)]="newEngineer().password"
      placeholder="Enter Password"
      required>

      <label>Address</label>
      <input class="input-form"
      name="address"
      [(ngModel)]="newEngineer().address"
      placeholder="Enter Address">

      <div class="name">
        <div class="name-group">
          <label>Nationality</label>
          <input class="input-form"
          name="nationality"
          [(ngModel)]="newEngineer().nationality"
          placeholder="Nationality">
        </div>

        <div class="name-group">
          <label>Birth Date</label>
          <input class="input-form"
          type="date"
          name="birthDate"
          [(ngModel)]="newEngineer().birthDate">
        </div>
      </div>

      <div class="name">
        <div class="name-group">
          <label>National Number</label>
          <input class="input-form"
          name="nationalNumber"
          [(ngModel)]="newEngineer().nationalNumber"
          placeholder="National Number">
        </div>

        <div class="name-group">
          <label>Religion</label>

          <select class="input-form"
          name="religion"
          [(ngModel)]="newEngineer().religion">
            <option value="">Select Religion</option>
            <option value="Muslim">Muslim</option>
            <option value="Christian">Christian</option>

          </select>

        </div>
      </div>

      <label>Gender</label>

      <select class="input-form"
      name="gender"
      [(ngModel)]="newEngineer().gender">
        <option value="">Select Gender</option>
        <option value="M">Male</option>
        <option value="F">Female</option>
      </select>
    
      <h2>Professional Information</h2>
      <label>Education</label>
      <input class="input-form"
      name="education"
      [(ngModel)]="newEngineer().education"
      placeholder="Education">
      <label>Years Of Experience</label>
      <input class="input-form"
      type="number"
      name="numberOfYearsOfExperience"
      [(ngModel)]="newEngineer().numberOfYearsOfExperience"
      placeholder="Years Of Experience">
      <label>Employment History</label>
      <textarea
      class="textarea-form"
      rows="8"
      name="employmentHistory"
      [(ngModel)]="newEngineer().employmentHistory"
      placeholder="Employment History"></textarea>

    </div>
  </div>
  <div class="button-area">
    <button
    type="submit"
    [disabled]="submitting()">

      {{ submitting() ? 'Adding...' : 'Add Engineer' }}

    </button>

  </div>

</form>
  </div>
</div>
