<div class="layout">


  <aside class="sidebar">

    <div class="logo">
      <img src="assets/images/logo.png" alt="Logo">
    </div>

    <ul class="menu">

      <li
        *ngFor="let item of sidebarItems"
        [class.active]="item.active">

        <a href="#">

          <span class="material-icons">
            {{ item.icon }}
          </span>

          <span>
            {{ item.label }}
          </span>

        </a>

      </li>

    </ul>

  </aside>


  <main class="content">

    <div class="page-header">

      <h2>Engineers</h2>

      <p>
        Dashboard /
        Engineers /
        <span>Add Engineer</span>
      </p>

    </div>

    <div class="engineer-card">

     

      <div class="image-section">

        <img
          src="assets/images/engineer.png"
          alt="Engineer">

      </div>

      

      <div class="form-section">

        <h3>Personal Information</h3>

        <form
          [formGroup]="engineerForm"
          (ngSubmit)="onSubmit()">

         

          <div class="form-group">

            <label>Full Name *</label>

            <input
              type="text"
              formControlName="fullName"
              placeholder="Enter Full Name">

            <small
              *ngIf="engineerForm.get('fullName')?.touched &&
                     engineerForm.get('fullName')?.invalid">

              Full Name is required

            </small>

          </div>


          <div class="form-group">

            <label>Email *</label>

            <input
              type="email"
              formControlName="email"
              placeholder="Enter Email">

            <small
              *ngIf="engineerForm.get('email')?.touched &&
                     engineerForm.get('email')?.invalid">

              Please enter a valid email

            </small>

          </div>

         
          <div class="form-group">

            <label>Phone *</label>

            <input
              type="text"
              formControlName="phone"
              placeholder="Enter Phone Number">

            <small
              *ngIf="engineerForm.get('phone')?.touched &&
                     engineerForm.get('phone')?.invalid">

              Phone must contain 11 digits

            </small>

          </div>

          <h4>Professional Information</h4>

         

          <div class="form-group">

            <select formControlName="subject">

              <option value="">
                Select Subject
              </option>

              <option
                *ngFor="let subject of subjects"
                [value]="subject.name">

                {{subject.name}}

              </option>

            </select>

          </div>

         

          <div class="row">

            <input
              type="number"
              placeholder="Experience (Years)"
              formControlName="experience">

            <input
              type="date"
              formControlName="joinDate">

          </div>

          

          <div class="form-group">

            <input
              type="password"
              placeholder="Enter Password"
              formControlName="password">

            <small
              *ngIf="engineerForm.get('password')?.touched &&
                     engineerForm.get('password')?.invalid">

              Password must be at least 8 characters

            </small>

          </div>


          <button
            type="submit"
            [disabled]="loading">

            {{ loading ? 'Saving...' : 'Add Engineer' }}

          </button>

        </form>

      </div>

    </div>

  </main>

</div>
