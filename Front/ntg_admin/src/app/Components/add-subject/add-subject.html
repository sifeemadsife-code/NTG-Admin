<div class="dashboard">
  <app-sidebar></app-sidebar>
  <div class="content">
    <div class="page-header">
      <div>
        <h2>Add New Subject</h2>
        <p>
          Subjects >
          Add New Subject
        </p>

      </div>

      <button class="back-btn" routerLink="/subjects">


        Back to Subjects

      </button>

    </div>

    <form [formGroup]="subjectForm" (ngSubmit)="saveSubject()">
      <div class="card">
        <h3>Subject Information</h3>
        <div class="grid">
          <div class="form-group">
            <label>
              Subject Name <span>*</span>
            </label>

            <input type="text" formControlName="courseName" placeholder="Enter subject name">

          </div>
          <div class="form-group">

            <label>
              Engineer <span>*</span>

            </label>

            <select formControlName="teacherId">
              <option [ngValue]="null">
                Select engineer
              </option>
              @for (engineer of engineers(); track engineer.id) {
              @if (engineer.status == false) {
              <option [value]="engineer.id">
                {{ engineer.firstName }} {{ engineer.lastName }}
              </option>
              }
              }
            </select>
          </div>

          <div class="form-group">

            <label>
              Description <span>*</span>
            </label>
            <textarea rows="5" formControlName="description" placeholder="Enter subject description">
            </textarea>
          </div>
          <div class="form-group">
            <label>
              Study Plan <span>*</span>
            </label>
            <textarea rows="5" formControlName="studyPlan" placeholder="Enter study plan"></textarea>
          </div>
          <div class="form-group">
            <label>
              Term ID
            </label>
            <select formControlName="termId">
              <option [ngValue]="null">Select Term</option>
              <option [ngValue]="1">First Term</option>
              <option [ngValue]="2">Second Term</option>
            </select>
          </div>
        </div>
        <div class="buttons">
          <button type="button" class="cancel" routerLink="/subjects">
            Cancel
          </button>
          <button type="submit" class="save" [disabled]="saving()">

            {{ saving() ? 'Saving...' : 'Save Subject' }}

          </button>
        </div>
      </div>
    </form>
  </div>
</div>
